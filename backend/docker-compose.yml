services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - 8000:8000
    env_file:
      - .env
    image: backend-local
    networks:
      - workflow-network

  seed:
    image: backend-local
    container_name: seed
    depends_on:
      - backend
    command: ["npm", "run", "seed"]
    env_file:
      - .env
    pull_policy: never

networks:
  workflow-network:
    external: true
